<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENOCLONE - ORIGINALITY HAS AN ORIGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Please don't copy my shyt... unless you plan to make money with me. 1/12/2025 - odot! -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            font-family: "Press Start 2P", serif;
            background-color: #000;
            display: flex;
            flex-direction: column;
            
            justify-content: space-between;
        }

        #ar-button {
            width: 100%; /* Full width */
            padding: 20px; /* Larger padding for a bigger button */
            font-size: 1.5rem; /* Larger font size */
            position: absolute;
            bottom: 20px; /* Positioned at the bottom */
            left: 0;
            z-index: 10;
        }

        canvas {
            display: none; /* Hide the canvas until AR is activated */
        }

        .content {
            text-align: center;
            margin-top: auto; /* Push content to the top */
            color: rgb(255, 255, 255);
        }

        .logo-container {
            text-align: center;
            margin: 20px 0;
        }

        .logo {
            max-width: 100%; /* Responsive logo */
            height: auto;
        }
    </style>
    <!-- Please don't copy my shyt... unless you plan to make money with me. 1/12/2025 - odot! -->
</head>
<body>

    <d<!-- Nav bar -->
        <div class="container-fluid">
        <nav class="navbar bg-body-tertiary">
          <div class="container">
            <a class="navbar-brand" href="#">
              <img src="./models/2deep.png" alt="Bootstrap" width="50" height="auto">
            </a>
          </div>
        </nav>
            </div>    
    <!-- Nav bar ends -->
            <div class="logo-container">
                <img src="./models/2deep.png" alt="MeNoClone Logo" class="logo"> 
                <hr>
                <h1 class="text-white">MENOCLONE</h1>
                <!-- Please don't copy my shyt... unless you plan to make money with me. 1/12/2025 - odot! -->
                <h4 class="text-white">BETA | v.01</h4>
    </div>

    <button id="ar-button" class="btn btn-light animate__animated animate__bounce --animate-duration, .2s">ACTIVATE REALM</button>
    <canvas id="canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Please don't copy my shyt... unless you plan to make money with me. 1/12/2025 - odot! -->
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/dist/webxr-polyfill.js"></script>

    <script>
        let scene, camera, renderer, controller;
        const modelPath = './models/ufo%20tee.gltf'; // gltf

        document.getElementById('ar-button').addEventListener('click', async () => {
            if (navigator.xr) {
                const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] });
                session.addEventListener('end', () => {
                    renderer.dispose();
                    document.getElementById('canvas').style.display = 'none';
                });
                document.getElementById('canvas').style.display = 'block';
                initARSession(session);
            }
        });

        function initARSession(session) {
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
            renderer.xr.enabled = true;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            const loader = new THREE.GLTFLoader();
            loader.load(modelPath, (gltf) => {
                scene.add(gltf.scene);
            });
            
            const light = new THREE.HemisphereLight(0xffffff, 0x444444);
            scene.add(light);

            controller = renderer.xr.getController(0);
            scene.add(controller);

            renderer.xr.setSession(session);
            animate();
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
